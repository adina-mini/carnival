<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A050B" />
      <stop offset="100%" stopColor="#140205" />
    </linearGradient>
    <linearGradient id="dahliaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5E4B7" />
      <stop offset="50%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#9E7C20" />
    </linearGradient>
    <linearGradient id="dahliaBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8A1828" />
      <stop offset="100%" stopColor="#4A0812" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#dahliaGold)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Symmetrical Outer Petals -->
  <path d="M32 10 C34 19 34 24 32 32 C30 24 30 19 32 10 Z" fill="url(#dahliaGold)" />
  <path d="M32 54 C34 45 34 40 32 32 C30 40 30 45 32 54 Z" fill="url(#dahliaGold)" />
  <path d="M10 32 C19 34 24 34 32 32 C24 30 19 30 10 32 Z" fill="url(#dahliaGold)" />
  <path d="M54 32 C45 34 40 34 32 32 C40 30 45 30 54 32 Z" fill="url(#dahliaGold)" />

  <!-- Diagonal Petals -->
  <path d="M16 16 C23 20 27 24 32 32 C24 27 20 23 16 16 Z" fill="url(#dahliaBurgundy)" stroke="url(#dahliaGold)" stroke-width="0.8" />
  <path d="M48 16 C41 20 37 24 32 32 C40 27 44 23 48 16 Z" fill="url(#dahliaBurgundy)" stroke="url(#dahliaGold)" stroke-width="0.8" />
  <path d="M16 48 C23 44 27 40 32 32 C24 37 20 41 16 48 Z" fill="url(#dahliaBurgundy)" stroke="url(#dahliaGold)" stroke-width="0.8" />
  <path d="M48 48 C41 44 37 40 32 32 C40 37 44 41 48 48 Z" fill="url(#dahliaBurgundy)" stroke="url(#dahliaGold)" stroke-width="0.8" />

  <!-- Inner Petals -->
  <path d="M32 18 C33.5 24 33.5 28 32 32 C30.5 28 30.5 24 32 18 Z" fill="url(#dahliaGold)" />
  <path d="M32 46 C33.5 40 33.5 36 32 32 C30.5 36 30.5 40 32 46 Z" fill="url(#dahliaGold)" />
  <path d="M18 32 C24 33.5 28 33.5 32 32 C28 30.5 24 30.5 18 32 Z" fill="url(#dahliaGold)" />
  <path d="M46 32 C40 33.5 36 33.5 32 32 C36 30.5 40 30.5 46 32 Z" fill="url(#dahliaGold)" />

  <!-- Floral Core -->
  <circle cx="32" cy="32" r="4.5" fill="url(#dahliaBurgundy)" stroke="url(#dahliaGold)" stroke-width="1.2" />
  <circle cx="32" cy="32" r="1.8" fill="#FAF5EF" />
</svg>
